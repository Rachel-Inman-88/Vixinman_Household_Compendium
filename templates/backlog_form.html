{% extends "base.html" %}
{% block title %}New idea{% endblock %}
{% block content %}
<div class="toolbar">
  <h1>＋ New idea</h1>
  <a href="{{ url_for('backlog_page') }}" class="btn btn-secondary">← Backlog</a>
</div>

<div class="card">
  <form method="post" action="{{ url_for('backlog_new') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
      <div class="field wide"><label for="name">Idea *</label>
        <input id="name" name="name" required placeholder="e.g. Repaint the bedroom"></div>
      <div class="field"><label for="proposed_by">Proposed by (optional)</label>
        <select id="proposed_by" name="proposed_by">
          <option value="">— unspecified —</option>
          {% for e in members %}<option value="{{ e['id'] }}">{{ e["name"] }}</option>{% endfor %}
        </select></div>
      <div class="field"><label for="target_date">Target / someday date (optional)</label>
        <input id="target_date" name="target_date" type="date"></div>
      <div class="field"><label for="budget_estimate">Rough budget estimate (optional)</label>
        <input id="budget_estimate" name="budget_estimate" type="number" step="0.01" min="0"></div>
      <div class="field"><label for="reminder_date">Custom reminder (optional)</label>
        <input id="reminder_date" name="reminder_date" type="date"></div>
      <div class="field wide"><label for="notes">Notes (optional)</label>
        <input id="notes" name="notes" placeholder="anything else about the idea"></div>
    </div>
    <div class="actions">
      <button type="submit" class="btn">＋ Add to backlog</button>
      <a href="{{ url_for('backlog_page') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ "Edit budget category" if eb else "New budget category" }}{% endblock %}
{% block content %}
<div class="toolbar">
  <h1>{{ "Edit budget category" if eb else "＋ New budget category" }}</h1>
  <a href="{{ url_for('household_budget_page') }}" class="btn btn-secondary">← Budget</a>
</div>

<div class="card">
  <form method="post" action="{{ url_for('household_budget_edit', budget_id=eb['id']) if eb else url_for('household_budget_new') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
      <div class="field"><label for="budget_category">Category *</label>
        <input id="budget_category" name="category" list="budget_category_options" required
               value="{{ eb['category'] if eb else '' }}" placeholder="e.g. Groceries"></div>
      <div class="field"><label for="monthly_amount">Monthly target *</label>
        <input id="monthly_amount" name="monthly_amount" type="number" step="0.01" min="0" required
               value="{{ '%.2f'|format(eb['monthly_amount']) if eb else '' }}"></div>
    </div>
    <div class="actions">
      <button type="submit" class="btn">{{ "Save changes" if eb else "＋ Add budget category" }}</button>
      <a href="{{ url_for('household_budget_page') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>

<datalist id="budget_category_options">
  {% for c in household_budget_categories %}<option value="{{ c }}">{% endfor %}
</datalist>
{% endblock %}

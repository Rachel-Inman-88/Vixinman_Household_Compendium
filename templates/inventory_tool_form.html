{% extends "base.html" %}
{% block title %}{{ "Edit tool" if tool else "New tool" }}{% endblock %}
{% block content %}
<div class="toolbar">
  <h1>🧰 {{ "Edit tool" if tool else "New tool" }}</h1>
  <a href="{{ url_for('inventory_page') }}" class="btn btn-secondary">← Back to Inventory</a>
</div>

<div class="card">
  <form method="post" action="{{ url_for('inventory_tool_edit', tool_id=tool['id']) if tool else url_for('inventory_tool_new') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
      <div class="field wide"><label>Tool name *</label><input name="name" required value="{{ tool['name'] if tool else '' }}" placeholder="e.g. Cordless drill/driver"></div>
      <div class="field"><label>Category</label><input name="category" value="{{ tool['category'] if tool else '' }}" list="tool-cat-list" placeholder="e.g. Power tools"></div>
      <datalist id="tool-cat-list">
        <option value="Power tools"><option value="Hand tools"><option value="Test equipment">
        <option value="Layout"><option value="Access & safety"><option value="Misc">
      </datalist>
      <div class="field"><label>Make</label><input name="make" value="{{ tool['make'] if tool else '' }}"></div>
      <div class="field"><label>Model</label><input name="model" value="{{ tool['model'] if tool else '' }}"></div>
      <div class="field wide"><label>Description</label><input name="description" value="{{ tool['description'] if tool else '' }}"></div>
      <div class="field"><label>Purchased from</label><input name="purchased_from" value="{{ tool['purchased_from'] if tool else '' }}" placeholder="e.g. Home Depot"></div>
      <div class="field"><label>Cost $</label><input name="cost" type="number" step="0.01" min="0" value="{{ '%.2f'|format(tool['cost']) if tool and tool['cost'] is not none else '' }}"></div>
      <div class="field wide"><label>Purchase / listing URL</label><input name="purchase_url" value="{{ tool['purchase_url'] if tool else '' }}" placeholder="https://…"></div>
      <div class="field wide"><label>Manual / datasheet URL</label><input name="manual_url" value="{{ tool['manual_url'] if tool else '' }}" placeholder="https://…"></div>
      <div class="field wide"><label>Notes</label><input name="notes" value="{{ tool['notes'] if tool else '' }}"></div>
    </div>
    <div class="actions" style="margin-top:0.8rem;"><button type="submit" class="btn">{{ "Save changes" if tool else "＋ Add tool" }}</button></div>
  </form>
</div>

{% if tool %}
<div class="card">
  <form method="post" action="{{ url_for('inventory_tool_delete', tool_id=tool['id']) }}"
        onsubmit="return confirm('Move this tool to the trash?');" style="margin:0;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn btn-secondary" style="color:#b02a2a !important; border-color:#b02a2a;">🗑 Move to trash</button>
  </form>
</div>
{% endif %}
{% endblock %}

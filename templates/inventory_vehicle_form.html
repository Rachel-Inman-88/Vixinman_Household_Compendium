{% extends "base.html" %}
{% block title %}{{ "Edit vehicle" if vehicle else "New vehicle" }}{% endblock %}
{% block content %}
<div class="toolbar">
  <h1>🚗 {{ "Edit vehicle" if vehicle else "New vehicle" }}</h1>
  <a href="{{ url_for('inventory_page') }}" class="btn btn-secondary">← Back to Inventory</a>
</div>

<div class="card">
  <form method="post" action="{{ url_for('inventory_vehicle_edit', vehicle_id=vehicle['id']) if vehicle else url_for('inventory_vehicle_new') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
      <div class="field wide"><label>Vehicle name *</label><input name="name" required value="{{ vehicle['name'] if vehicle else '' }}" placeholder="e.g. Family car, Pickup truck"></div>
      <div class="field"><label>Nickname</label><input name="nickname" value="{{ vehicle['nickname'] if vehicle else '' }}" placeholder="e.g. Big Blue"></div>
      <div class="field"><label>Category</label><input name="category" value="{{ vehicle['category'] if vehicle else '' }}" list="veh-cat-list" placeholder="e.g. Car"></div>
      <datalist id="veh-cat-list">
        <option value="Car"><option value="Truck"><option value="Trailer">
        <option value="Lawn equipment"><option value="Recreational"><option value="Misc">
      </datalist>
      <div class="field"><label>Make</label><input name="make" value="{{ vehicle['make'] if vehicle else '' }}"></div>
      <div class="field"><label>Model</label><input name="model" value="{{ vehicle['model'] if vehicle else '' }}"></div>
      <div class="field"><label>Year</label><input name="year" value="{{ vehicle['year'] if vehicle else '' }}" placeholder="e.g. 2019"></div>
      <div class="field"><label>Current mileage</label><input name="current_mileage" type="number" min="0" step="1" value="{{ vehicle['current_mileage'] if vehicle and vehicle['current_mileage'] is not none else '' }}" placeholder="e.g. 84210"></div>
      <div class="field wide"><label>Description</label><input name="description" value="{{ vehicle['description'] if vehicle else '' }}"></div>
      <div class="field"><label>Purchased from</label><input name="purchased_from" value="{{ vehicle['purchased_from'] if vehicle else '' }}" placeholder="e.g. the dealership"></div>
      <div class="field"><label>Cost $</label><input name="cost" type="number" step="0.01" min="0" value="{{ '%.2f'|format(vehicle['cost']) if vehicle and vehicle['cost'] is not none else '' }}"></div>
      <div class="field wide"><label>Purchase / listing URL</label><input name="purchase_url" value="{{ vehicle['purchase_url'] if vehicle else '' }}" placeholder="https://…"></div>
      <div class="field wide"><label>Manual / datasheet URL</label><input name="manual_url" value="{{ vehicle['manual_url'] if vehicle else '' }}" placeholder="https://…"></div>
      <div class="field wide"><label>Notes</label><input name="notes" value="{{ vehicle['notes'] if vehicle else '' }}" placeholder="e.g. VIN, plate, service due"></div>
    </div>
    <div class="actions" style="margin-top:0.8rem;"><button type="submit" class="btn">{{ "Save changes" if vehicle else "＋ Add vehicle" }}</button></div>
  </form>
</div>

{% if vehicle %}
<div class="card">
  <form method="post" action="{{ url_for('inventory_vehicle_delete', vehicle_id=vehicle['id']) }}"
        onsubmit="return confirm('Move this vehicle to the trash?');" style="margin:0;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn btn-secondary" style="color:#b02a2a !important; border-color:#b02a2a;">🗑 Move to trash</button>
  </form>
</div>
{% endif %}
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ "Edit item" if item else "New item" }}{% endblock %}
{% block content %}
<div class="toolbar">
  <h1>📦 {{ "Edit inventory item" if item else "New item" }}</h1>
  <a href="{{ url_for('inventory_page') }}" class="btn btn-secondary">← Back to Inventory</a>
</div>

<div class="card">
  <form method="post" action="{{ url_for('inventory_item_edit', item_id=item['id']) if item else url_for('inventory_item_new') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
      <div class="field">
        <label for="category">Category *</label>
        <input id="category" name="category" list="category_list" required
               value="{{ item['category'] if item else category }}"
               placeholder="e.g. Pantry, Tools, Electronics">
        <datalist id="category_list">
          {% for c in categories %}<option value="{{ c }}">{% endfor %}
        </datalist>
      </div>
      <div class="field"><label>Make</label><input name="make" value="{{ item['make'] if item else '' }}"></div>
      <div class="field"><label>Model</label><input name="model" value="{{ item['model'] if item else '' }}"></div>
      <div class="field wide"><label>Description</label><input name="description" value="{{ item['description'] if item else '' }}"></div>
      <div class="field"><label>Purchased from</label><input name="purchased_from" value="{{ item['purchased_from'] if item else '' }}" placeholder="e.g. Amazon, Home Depot"></div>
      <div class="field"><label>Cost $</label><input name="cost" type="number" step="0.01" min="0" value="{{ '%.2f'|format(item['cost']) if item and item['cost'] is not none else '' }}"></div>
      <div class="field"><label>Quantity</label><input name="quantity" type="number" min="0" value="{{ item['quantity'] if item else 0 }}"></div>
      <div class="field wide"><label>Purchase URL</label><input name="purchase_url" value="{{ item['purchase_url'] if item else '' }}" placeholder="https://…"></div>
      <div class="field wide"><label>Manual / datasheet URL</label><input name="manual_url" value="{{ item['manual_url'] if item else '' }}" placeholder="https://…"></div>
      <div class="field wide"><label>Notes</label><input name="notes" value="{{ item['notes'] if item else '' }}"></div>
    </div>

    <div class="actions" style="margin-top:0.8rem;"><button type="submit" class="btn">{{ "Save changes" if item else "＋ Add item" }}</button></div>
  </form>
</div>

{% if item %}
<div class="card">
  <form method="post" action="{{ url_for('inventory_item_delete', item_id=item['id']) }}"
        onsubmit="return confirm('Move this item to the trash?');" style="margin:0;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn btn-secondary" style="color:#b02a2a !important; border-color:#b02a2a;">🗑 Move to trash</button>
  </form>
</div>
{% endif %}
{% endblock %}
